name: keep-alive

# Pings Supabase + the live site every 3 days so the free-tier project is
# never flagged idle (auto-pause after ~7 days without API activity).
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (cheap row probe)
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "supabase http=%{http_code}\n"

      - name: Warm production site
        run: |
          curl -fsS "https://www.portfolio-bima.web.id/en" \
            -o /dev/null -w "site http=%{http_code}\n"
